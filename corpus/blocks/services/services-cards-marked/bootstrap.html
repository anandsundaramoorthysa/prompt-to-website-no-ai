<section class="pw-servm" id="services">
  <div class="container">
    <h2 class="pw-section__title">{{heading}}</h2>
    <p class="pw-section__sub">{{subheading}}</p>
    <div class="row g-4">
      <!-- pw:repeat items -->
      <div class="col-md-4">
      <article class="pw-servm__card">
        <span class="pw-servm__mark">{{icon}}</span>
        <h3 class="pw-servm__title">{{title}}</h3>
        <p class="pw-servm__body">{{body}}</p>
      </article>
      </div>
      <!-- /pw:repeat -->
    </div>
  </div>
</section>
