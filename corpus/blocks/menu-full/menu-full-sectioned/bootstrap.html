<section class="pw-menu" id="menu">
  <div class="container">
    <h2 class="pw-section__title">{{heading}}</h2>
    <!-- pw:repeat courses -->
    <div class="pw-menu__course">
      <h3 class="pw-menu__course-name">{{course}}</h3>
      <dl class="pw-menu__items">
        <div class="pw-menu__row">
          <dt class="pw-menu__dish">{{dish}}</dt>
          <dd class="pw-menu__price">{{price}}</dd>
        </div>
      </dl>
      <p class="pw-menu__note">{{note}}</p>
    </div>
    <!-- /pw:repeat -->
  </div>
</section>
