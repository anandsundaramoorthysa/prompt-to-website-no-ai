<section class="pw-hero" id="top">
  <div class="container">
    <div class="row align-items-center g-4">
      <div class="col-md-6">
        <h1 class="pw-hero__title">{{heading}}</h1>
        <p class="pw-hero__sub">{{subheading}}</p>
        <div class="pw-hero__actions">
          <a class="btn pw-btn pw-btn--primary" href="#cta">{{cta_primary}}</a>
          <a class="btn pw-btn pw-btn--ghost" href="#features">{{cta_secondary}}</a>
        </div>
      </div>
      <div class="col-md-6">
        {{asset:hero-gradient}}
      </div>
    </div>
  </div>
</section>
