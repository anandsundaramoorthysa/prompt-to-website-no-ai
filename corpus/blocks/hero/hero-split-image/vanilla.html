<section class="pw-hero" id="top">
  <div class="pw-container pw-hero__grid">
    <div>
      <h1 class="pw-hero__title">{{heading}}</h1>
      <p class="pw-hero__sub">{{subheading}}</p>
      <div class="pw-hero__actions">
        <a class="pw-btn pw-btn--primary" href="#cta">{{cta_primary}}</a>
        <a class="pw-btn pw-btn--ghost" href="#features">{{cta_secondary}}</a>
      </div>
    </div>
    <div>{{asset:hero-gradient}}</div>
  </div>
</section>
