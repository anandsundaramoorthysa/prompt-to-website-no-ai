<section class="pw-help">
  <div class="container">
    <h2 class="pw-section__title">{{heading}}</h2>
    <div class="row g-4">
      <!-- pw:repeat items -->
      <div class="col-md-4">
      <article class="pw-help__item">
        <h3 class="pw-help__title">{{title}}</h3>
        <p class="pw-help__body">{{body}}</p>
        <a class="pw-help__link" href="{{href}}">{{link_label}}</a>
      </article>
      </div>
      <!-- /pw:repeat -->
    </div>
  </div>
</section>
