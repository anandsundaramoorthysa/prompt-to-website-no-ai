<section class="pw-quotes">
  <div class="container">
    <h2 class="pw-section__title">{{heading}}</h2>
    <div class="row g-4">
      <!-- pw:repeat quotes -->
      <div class="col-md-4">
        <figure class="pw-quote">
          <blockquote class="pw-quote__text"><p>{{quote}}</p></blockquote>
          <figcaption class="pw-quote__by">{{name}}, {{role}}</figcaption>
        </figure>
      </div>
      <!-- /pw:repeat -->
    </div>
  </div>
</section>
