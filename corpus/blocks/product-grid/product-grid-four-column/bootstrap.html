<section class="pw-shop4" id="shop">
  <div class="container">
    <h2 class="pw-section__title">{{heading}}</h2>
    <p class="pw-section__sub">{{subheading}}</p>
    <ul class="pw-shop4__list row g-4">
      <!-- pw:repeat items -->
      <li class="col-md-3 pw-shop4__item">
        {{asset:tile}}
        <h3 class="pw-shop4__name">{{name}}</h3>
        <p class="pw-shop4__price">{{price}}</p>
      </li>
      <!-- /pw:repeat -->
    </ul>
  </div>
</section>
