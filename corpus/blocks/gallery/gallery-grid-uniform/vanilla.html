<section class="pw-gallery" id="gallery">
  <div class="pw-container">
    <h2 class="pw-section__title">{{heading}}</h2>
    <ul class="pw-gallery__list pw-grid pw-grid--3">
      <!-- pw:repeat items -->
      <li class="pw-gallery__item">
        {{asset:tile}}
        <p class="pw-gallery__caption">{{caption}}</p>
      </li>
      <!-- /pw:repeat -->
    </ul>
  </div>
</section>
