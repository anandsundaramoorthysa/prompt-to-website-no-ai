<section class="pw-faq" id="faq">
  <div class="container">
    <h2 class="pw-section__title">{{heading}}</h2>
    <div class="pw-faq__list">
      <!-- pw:repeat questions -->
      <details class="pw-faq__item">
        <summary class="pw-faq__q">{{q}}</summary>
        <div class="pw-faq__a"><p>{{a}}</p></div>
      </details>
      <!-- /pw:repeat -->
    </div>
  </div>
</section>
